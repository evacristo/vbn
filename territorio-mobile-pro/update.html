<!doctype html>
<html lang="es-AR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f32a8"><title>Actualizar Corrientes Territorial Pro</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f3f7;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box}.card{max-width:420px;background:white;border:1px solid #d8d2de;border-radius:22px;padding:24px;text-align:center;box-shadow:0 18px 45px rgb(0 0 0/.12)}.spinner{width:38px;height:38px;margin:0 auto 16px;border:4px solid #e8dff0;border-top-color:#6f32a8;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#667085;line-height:1.5}</style></head>
<body><main class="card"><div class="spinner"></div><h1>Actualizando</h1><p id="status">Limpiando únicamente los archivos técnicos. Tus datos privados no se borran.</p></main>
<script>
(async function(){
  try{
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.filter(r=>r.scope.includes('/territorio-mobile-pro/')).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('ct-pro-')).map(k=>caches.delete(k)));
    }
    document.getElementById('status').textContent='Actualización lista. Abriendo la aplicación…';
  }catch(error){
    document.getElementById('status').textContent='La aplicación se abrirá igualmente con una versión nueva.';
  }
  setTimeout(()=>location.replace('./?release=20260726-3'),500);
})();
</script></body></html>

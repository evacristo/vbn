name: Audit official Corrientes results

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit tools
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Capture official results application
        run: python tooling/audit_official_results.py --out official-results-audit

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: official-results-audit
          path: official-results-audit
          retention-days: 3

name: Capture official result requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - run: python tooling/capture_official_requests.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-request-capture
          path: official-request-capture
          retention-days: 3

name: Build LLA candidates 2025

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out data builder
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out published application
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0

      - name: Install PDF and Python tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Build official candidate database
        run: |
          python source/tooling/build_lla_candidates.py --site site
          cp source/tooling/network-lla.js site/network-lla.js
          cp source/tooling/network-lla.css site/network-lla.css

      - name: Upload extraction diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lla-candidates-2025-diagnostic
          path: |
            site/lla-candidates-2025.json
            site/lla-candidates-2025-report.txt
          retention-days: 3

      - name: Validate generated application data
        run: |
          node --check site/network-lla.js
          node --check site/lla-candidates-2025.js
          python -m json.tool site/lla-candidates-2025.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('site/lla-candidates-2025.json').read_text(encoding='utf-8'))
          assert len(data['people']) >= 50, len(data['people'])
          assert len(data['nominations']) >= 60, len(data['nominations'])
          assert len(data['coverage']) >= 73, len(data['coverage'])
          print(json.dumps(data['report'], ensure_ascii=False, indent=2))
          for jurisdiction, office in [
              ('Provincia de Corrientes', 'Gobernador'),
              ('Alvear', 'Intendente'),
              ('Goya', 'Intendente'),
              ('Capital', 'Concejal titular'),
          ]:
              found = [row for row in data['nominations'] if row['jurisdiction'] == jurisdiction and row['office'] == office]
              print('CHECK', jurisdiction, office, len(found), [row['personId'] for row in found[:3]])
          print('JURISDICTIONS', sorted({row['jurisdiction'] for row in data['nominations']}))
          PY
          grep -q 'network-lla.js' site/mobile-v2.html

      - name: Hold publication for diagnostic review
        run: echo 'Diagnostic generated; publication is intentionally paused.'

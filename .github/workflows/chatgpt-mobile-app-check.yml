name: Check mobile ChatGPT app

on:
  push:
    branches: [chatgpt-mobile-app]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatgpt-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Build container
        run: docker build -t corrientes-territorial-chatgpt-app .

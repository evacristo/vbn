<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f32a8"><title>Actualizando Corrientes TI</title><style>body{margin:0;background:#f5f3f7;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.box{max-width:420px;background:#fff;border:1px solid #ddd8e4;border-radius:18px;padding:22px;text-align:center}.dot{width:34px;height:34px;margin:0 auto 14px;border:4px solid #e9dff1;border-top-color:#6f32a8;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#667085;line-height:1.45}</style></head><body><div class="box"><div class="dot"></div><h2>Reparando el mapa</h2><p id="msg">Eliminando el caché anterior y recargando los resultados…</p></div><script>(async()=>{const go=()=>location.replace('./mobile-v2.html?v=8');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}await Promise.allSettled([fetch('./election-results-2025.js',{cache:'reload'}),fetch('./election-results-2025.json?v=8',{cache:'reload'}),fetch('./results-suite.js?v=1',{cache:'reload'})]);document.getElementById('msg').textContent='Datos recargados. Abriendo el mapa…';setTimeout(go,650)}catch(e){document.getElementById('msg').textContent='Abriendo la versión reparada…';setTimeout(go,650)}})();</script></body></html>
